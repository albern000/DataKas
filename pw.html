<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk – Kas Kelas</title>
<style>
  :root {
    --bg: #e4ecf3;
    --paper: #ffffff;
    --ink: #1c2b3a;
    --muted: #5d6f80;
    --line: #c9d9e8;
    --margin: #d9534f;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a24; --paper: #182635; --ink: #e8eff6; --muted: #93a6b8;
      --line: #27394b; --margin: #e57a76; --accent: #6bb4e3; --accent-ink: #0c1620; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  }
  .buku {
    width: 100%; max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 28px 24px 26px 44px;
    position: relative;
    background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line) 31px, var(--line) 32px);
    box-shadow: 0 8px 24px rgba(20, 40, 60, .12);
  }
  .buku::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 28px; width: 2px; background: var(--margin);
  }
  h1 { font-size: 1.5rem; line-height: 32px; margin: 0; }
  p.sub { margin: 0 0 20px; color: var(--muted); line-height: 32px; font-size: .95rem; }
  label { display: block; font-weight: 600; font-size: .95rem; line-height: 32px; }
  .field { display: flex; gap: 8px; }
  input[type="password"], input[type="text"] {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px;
    font: inherit; color: var(--ink);
    background: var(--paper); border: 2px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .lihat {
    height: 44px; padding: 0 12px; font: inherit; font-size: .9rem;
    background: transparent; color: var(--accent); border: 2px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .masuk {
    width: 100%; height: 48px; margin-top: 16px;
    font: inherit; font-weight: 700; font-size: 1rem;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 6px; cursor: pointer;
  }
  .masuk:active { transform: translateY(1px); }
  #pesan { min-height: 32px; margin: 8px 0 0; line-height: 32px; font-size: .92rem; color: var(--error); }
  .goyang { animation: goyang .35s; }
  @keyframes goyang {
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) { .goyang { animation: none; } }
</style>
</head>
<body>
  <main class="buku" id="kartu">
    <h1>Kas Kelas XII TKJ 2</h1>
    <p class="sub">Masukkan password untuk membuka halaman.</p>

    <label for="pw">Password</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="button" class="lihat" id="lihat" aria-pressed="false">Lihat</button>
    </div>

    <button type="button" class="masuk" id="masuk">Masuk</button>
    <p id="pesan" role="alert"></p>
  </main>

<script>
  // ====== PENGATURAN — ubah dua baris ini ======
  var PASSWORD  = "xiitkj2";        // password yang benar
  var HALAMAN   = "Data_iuran.html"; // halaman tujuan setelah password benar
  // =============================================

  var pw = document.getElementById("pw");
  var pesan = document.getElementById("pesan");
  var kartu = document.getElementById("kartu");

  function setLogin() {
    try { sessionStorage.setItem("kas_login", "ya"); } catch (e) {}
  }

  function coba() {
    if (pw.value === PASSWORD) {
      setLogin();
      pesan.style.color = "var(--accent)";
      pesan.textContent = "Password benar. Membuka halaman…";
      window.location.href = HALAMAN;
    } else {
      pesan.style.color = "var(--error)";
      pesan.textContent = pw.value ? "Password salah. Coba lagi." : "Isi password dulu.";
      kartu.classList.remove("goyang");
      void kartu.offsetWidth;
      kartu.classList.add("goyang");
      pw.select();
    }
  }

  document.getElementById("masuk").addEventListener("click", coba);
  pw.addEventListener("keydown", function (e) { if (e.key === "Enter") coba(); });

  var lihat = document.getElementById("lihat");
  lihat.addEventListener("click", function () {
    var tampil = pw.type === "password";
    pw.type = tampil ? "text" : "password";
    lihat.textContent = tampil ? "Sembunyi" : "Lihat";
    lihat.setAttribute("aria-pressed", tampil);
  });
</script>

<!--
  ===== CARA MENGUNCI HALAMAN LAIN (mis. kas-kelas.html) =====
  Tempel skrip ini di <head> paling atas setiap halaman yang mau dikunci
  (halaman kas kelas dan halaman tunggakan):

  <script>
    try {
      if (sessionStorage.getItem("kas_login") !== "ya") {
        window.location.replace("masuk.html");
      }
    } catch (e) { window.location.replace("masuk.html"); }
  </script>
-->
</body>
</html>
